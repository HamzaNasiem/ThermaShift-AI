services:
  - type: web
    name: thermashift-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: FORTYGUARD_API_KEY
        value: 489e4282aa24d9c7d074195751e3faf6
      - key: CALLE_API_KEY
        value: iams_live_0UvYeesXBhr5GamQNqqc_b8da836ba3458377b7e17ca3dff69d76527d686f5c889839ea65c6096a0c90ec
      - key: CALLE_BASE_URL
        value: https://api.heycall-e.com/v1
      - key: FRONTEND_URL
        value: https://thermashift-ai.vercel.app
      - key: DATABASE_URL
        sync: false
