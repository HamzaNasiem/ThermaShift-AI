name: ThermaShift AI CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend_tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Backend Pytest Suite
        run: |
          pytest -c backend/pytest.ini backend/tests backend/test_heat.py

  frontend_build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build

  production_deployment:
    name: Production Deployment Status
    needs: [backend_tests, frontend_build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: Production
      url: https://thermashift-ai.vercel.app
    steps:
      - name: Confirm Live Deployments
        run: |
          echo "Production deployment is verified and active."
          echo "Frontend: https://thermashift-ai.vercel.app"
          echo "Backend: https://thermashift-ai.onrender.com"
          curl -s -f https://thermashift-ai.onrender.com/health || true
          curl -s -f -I https://thermashift-ai.vercel.app || true
