name: ThermaShift AI 24/7 Render Warm-Up Engine

on:
  schedule:
    - cron: '*/5 * * * *' # Pings Render every 5 minutes 24/7 to prevent sleep
  workflow_dispatch:

jobs:
  warm_up:
    name: Keep Render Backend Warm & Ready
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          echo "Pinging ThermaShift AI Render Backend..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://thermashift-ai.onrender.com/health)
          echo "Render Backend Status: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "Render Backend is 100% WARM, HOT in RAM, and READY for Judges!"
          else
            echo "Warning: Response code $HTTP_CODE"
          fi
